name: react
description: "Frontend React 19 + TypeScript SPA — layer composable sobre cualquier stack backend"
frontend: typescript
frontend_framework: react
tests_frontend: vitest
linter_frontend: biome

agent_skills:
  architect:
    - api-design
  typescript-reviewer:
    - frontend-patterns
    - coding-standards
    - design-system
    - ui-ux-pro-max
  ui-refactor:
    - ui-ux-pro-max
  e2e-runner:
    - e2e-testing

commands:
  design-md:
    when: "Al crear componentes React o refactorizar UI — aplica identidad visual"

rules:
  - react.md
  - coding-style.md
  - hooks.md
  - patterns.md
  - security.md
  - testing.md
