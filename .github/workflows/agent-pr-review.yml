name: Agent — PR Review

# Triggers on every PR open, update or reopen.
# Runs code-reviewer + security-reviewer + pr-test-analyzer in parallel
# and posts a combined markdown comment on the PR.
#
# Required secret: ANTHROPIC_API_KEY
# Required permission: pull-requests: write

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  code-review:
    runs-on: ubuntu-latest
    outputs:
      report: ${{ steps.review.outputs.report }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run code-reviewer agent
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}

          claude -p \
            --allowedTools "Bash(git diff*),Bash(git log*),Read,Grep,Glob" \
            --model sonnet \
            "You are the code-reviewer agent. Review the changes in this PR.
            Run: git diff ${BASE}...${HEAD}
            to see all changes, then read the full context of modified files.
            Apply the full review checklist: CRITICAL/HIGH/MEDIUM/LOW.
            Output the complete review in markdown. Be concise — skip LOW issues." \
          > /tmp/code-review.md

          echo "report<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/code-review.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  security-review:
    runs-on: ubuntu-latest
    outputs:
      report: ${{ steps.review.outputs.report }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run security-reviewer agent
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}

          claude -p \
            --allowedTools "Bash(git diff*),Bash(git log*),Read,Grep,Glob" \
            --model sonnet \
            "You are the security-reviewer agent. Analyze the PR changes for security vulnerabilities.
            Run: git diff ${BASE}...${HEAD}
            Focus on OWASP Top 10: injection, auth bypasses, XSS, exposed secrets, insecure dependencies.
            Only report real findings (>80% confidence). Output as markdown with severity labels." \
          > /tmp/security-review.md

          echo "report<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/security-review.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  pr-test-analysis:
    runs-on: ubuntu-latest
    outputs:
      report: ${{ steps.analysis.outputs.report }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run pr-test-analyzer agent
        id: analysis
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}

          claude -p \
            --allowedTools "Bash(git diff*),Bash(git log*),Read,Grep,Glob" \
            --model sonnet \
            "You are the pr-test-analyzer agent. Analyze test coverage for this PR.
            Run: git diff ${BASE}...${HEAD}
            Map changed code to existing tests. Identify:
            - Untested paths in modified files
            - Missing test cases for new logic branches
            - Coverage gaps rated by impact (HIGH/MEDIUM/LOW)
            Output a concise markdown coverage report. Rate overall coverage: ADEQUATE/GAPS/INSUFFICIENT." \
          > /tmp/test-analysis.md

          echo "report<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/test-analysis.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  post-review:
    needs: [code-review, security-review, pr-test-analysis]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Post combined review as PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODE_REPORT: ${{ needs.code-review.outputs.report }}
          SECURITY_REPORT: ${{ needs.security-review.outputs.report }}
          TEST_REPORT: ${{ needs.pr-test-analysis.outputs.report }}
        run: |
          BODY="## Code Review — Claude Code Agents

          ${CODE_REPORT:-*Code review did not complete.*}

          ---

          ## Security Review — Claude Code Agents

          ${SECURITY_REPORT:-*Security review did not complete.*}

          ---

          ## Test Coverage Analysis — Claude Code Agents

          ${TEST_REPORT:-*Test analysis did not complete.*}"

          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "${BODY}"
