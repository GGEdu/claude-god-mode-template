name: laravel-react
description: Laravel 13 (API REST) + React 19 (SPA) + Sanctum
backend: php
backend_framework: laravel
frontend: typescript
frontend_framework: react
database: mysql
auth: sanctum
tests_backend: pest
tests_frontend: vitest
linter_backend: pint
linter_frontend: biome
rules:
- laravel.md
- react.md
agents:
  architect:
    skills:
    - api-design
    - laravel-patterns
    - architecture-decision-records
    - deployment-patterns
    - docker-patterns
  planner:
    skills:
    - laravel-patterns
    - search-first
  tdd-guide:
    skills:
    - tdd-workflow
    - laravel-tdd
  code-reviewer:
    skills:
    - laravel-verification
    - verification-loop
  typescript-reviewer:
    skills:
    - frontend-patterns
    - coding-standards
    - design-system
  security-reviewer:
    skills:
    - security-review
    - laravel-security
  database-reviewer:
    skills:
    - database-migrations
  build-error-resolver:
    skills: []
  performance-optimizer:
    skills: []
  refactor-cleaner:
    skills: []
  e2e-runner:
    skills:
    - e2e-testing
  doc-updater:
    skills: []
  memory-consolidator:
    skills: []
  silent-failure-hunter:
    skills: []
  code-simplifier:
    skills: []
  loop-operator:
    skills:
    - safety-guard
  comment-analyzer:
    skills: []
  conversation-analyzer:
    skills: []
  docs-lookup:
    skills:
    - documentation-lookup
  pr-test-analyzer:
    skills: []
commands:
  jedi-review:
    when: Para código crítico — review de 3 expertos en paralelo (Beck, Fowler, Acton)
  git-workflow:
    when: Si necesitas recordar el workflow de commits y PRs
  last30days:
    when: Antes de /plan — valida conocimiento actual vs knowledge cutoff del modelo
  design-md:
    when: Al crear componentes React o refactorizar UI — aplica identidad visual
  workflow-runner:
    when: 'Para ejecutar un pipeline completo: /workflow feature, /workflow hotfix'
  canary-watch:
    when: Post-deploy — monitoreo con Playwright en URLs live
  codebase-onboarding:
    when: Al entrar en un repo nuevo — genera guía de onboarding
  benchmark:
    when: Medir rendimiento antes/después de un PR o cambio
  laravel-plugin-discovery:
    when: Buscar y evaluar paquetes Laravel via LaraPlugins.io
  continuous-learning-v2:
    when: Extrae patrones de sesiones y los persiste
  continuous-learning:
    when: v1 fallback — extrae patrones de sesiones
  ck:
    when: Persistent memory per-project, git-aware tracking
  plankton-code-quality:
    when: Write-time auto-format/lint enforcement
  strategic-compact:
    when: Sugiere /compact en puntos lógicos de la sesión
  security-scan:
    when: Escanea .claude/ por vulnerabilidades
  context-budget:
    when: Audita consumo de tokens en la sesión
  skill-comply:
    when: Verifica que skills/rules se siguen realmente
  skill-stocktake:
    when: Audita calidad de skills del proyecto
  prompt-optimizer:
    when: Mejora prompts del developer
  repo-scan:
    when: Auditoría cross-stack del código fuente
  product-lens:
    when: Diagnóstico producto pre-feature
  token-budget-advisor:
    when: Controla profundidad de respuesta
  team-builder:
    when: Compone equipos de agentes para tareas
  rules-distill:
    when: Extrae principios cross-cutting → rules
mcps:
  notebooklm: false
  n8n: false
