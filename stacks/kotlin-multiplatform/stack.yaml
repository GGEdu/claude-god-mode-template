name: kotlin-multiplatform
description: Kotlin — Ktor backend + Compose Multiplatform + Android
backend: kotlin
backend_framework: ktor
frontend: kotlin
frontend_framework: compose-multiplatform
database: postgresql
tests_backend: kotest
linter_backend: detekt
rules:
- kotlin.md
- android.md
agents:
  architect:
    skills:
    - api-design
    - architecture-decision-records
    - deployment-patterns
    - docker-patterns
    - kotlin-patterns
    - kotlin-ktor-patterns
    - android-clean-architecture
  planner:
    skills:
    - kotlin-patterns
    - search-first
    - council
    - agent-introspection-debugging
  tdd-guide:
    skills:
    - tdd-workflow
    - kotlin-testing
  code-reviewer:
    skills:
    - kotlin-patterns
    - kotlin-coroutines-flows
    - compose-multiplatform-patterns
    - ui-ux-pro-max
    - verification-loop
    - santa-method
  security-reviewer:
    skills:
    - security-review
  database-reviewer:
    skills:
    - database-migrations
    - kotlin-exposed-patterns
  performance-optimizer:
    skills: []
  refactor-cleaner:
    skills: []
  ui-engineer:
    skills:
    - ui-ux-pro-max
  e2e-runner:
    skills: []
  doc-updater:
    skills: []
  memory-consolidator:
    skills: []
  build-error-resolver:
    skills: []
  loop-operator:
    skills:
    - safety-guard
  code-simplifier:
    skills: []
  silent-failure-hunter:
    skills: []
  comment-analyzer:
    skills: []
  conversation-analyzer:
    skills: []
  docs-lookup:
    skills:
    - documentation-lookup
  pr-test-analyzer:
    skills: []
  github-orchestrator:
    skills: []
  harness-optimizer:
    skills:
    - hookify-rules
    - context-budget
  kotlin-reviewer:
    skills:
    - kotlin-patterns
    - kotlin-coroutines-flows
  kotlin-build-resolver:
    skills: []
commands:
  jedi-review:
    when: Para código crítico — review de 3 expertos en paralelo
  git-workflow:
    when: Si necesitas recordar el workflow de commits y PRs
  workflow-runner:
    when: 'Para ejecutar un pipeline completo: /workflow feature, /workflow hotfix'
  canary-watch:
    when: Post-deploy — monitoreo con Playwright en URLs live
  codebase-onboarding:
    when: Al entrar en un repo nuevo — genera guía de onboarding
  benchmark:
    when: Medir rendimiento antes/después de un PR o cambio
  continuous-learning-v2:
    when: Extrae patrones de sesiones y los persiste
  continuous-learning:
    when: v1 fallback — extrae patrones de sesiones
  ck:
    when: Persistent memory per-project, git-aware tracking
  plankton-code-quality:
    when: Write-time auto-format/lint enforcement
  strategic-compact:
    when: Sugiere /compact en puntos lógicos de la sesión
  security-scan:
    when: Escanea .claude/ por vulnerabilidades
  context-budget:
    when: Audita consumo de tokens en la sesión
  skill-comply:
    when: Verifica que skills/rules se siguen realmente
  skill-stocktake:
    when: Audita calidad de skills del proyecto
  prompt-optimizer:
    when: Mejora prompts del developer
  repo-scan:
    when: Auditoría cross-stack del código fuente
  product-lens:
    when: Diagnóstico producto pre-feature
  token-budget-advisor:
    when: Controla profundidad de respuesta
  team-builder:
    when: Compone equipos de agentes para tareas
  rules-distill:
    when: Extrae principios cross-cutting → rules
  council:
    when: Decisiones ambiguas con múltiples caminos válidos — 4 voces adversariales
  santa-method:
    when: Verificación adversarial pre-ship — 2 revisores independientes
  agent-introspection-debugging:
    when: Cuando un agente falla en loop o sin progreso
mcps:
  notebooklm: false
  n8n: false
