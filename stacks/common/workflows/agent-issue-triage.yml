name: Agent — Issue Triage

# Triggers when an issue is labeled with 'needs-plan'.
# Runs the planner agent and posts an implementation plan as an issue comment.
# Also adds the 'planned' label once done.
#
# Required secret: ANTHROPIC_API_KEY
# Required permission: issues: write

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

jobs:
  agent-plan:
    if: github.event.label.name == 'needs-plan'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run planner agent
        id: plan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ISSUE_TITLE="${{ github.event.issue.title }}"
          ISSUE_BODY="${{ github.event.issue.body }}"

          claude -p \
            --allowedTools "Read,Grep,Glob,Bash(git log*),Bash(find*)" \
            --model opus \
            "You are the planner agent. Create a detailed implementation plan for this issue.

            Issue title: ${ISSUE_TITLE}

            Issue description:
            ${ISSUE_BODY}

            Analyze the existing codebase structure (use Read, Grep, Glob tools to explore it).
            Then produce a complete implementation plan in markdown following your standard plan format:
            Overview, Requirements, Architecture Changes, Implementation Steps (with phases),
            Testing Strategy, Risks & Mitigations, Success Criteria.
            Be specific with file paths and actions." \
          > /tmp/plan.md

      - name: Post plan as issue comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMENT="## Implementation Plan — Claude Code Agent

          $(cat /tmp/plan.md)

          ---
          *Generated automatically by the planner agent. Remove the \`needs-plan\` label to disable.*"

          gh issue comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body "${COMMENT}"

      - name: Add 'planned' label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create label if it doesn't exist
          gh label create planned --color 0075ca --description "Has an implementation plan" \
            --repo ${{ github.repository }} 2>/dev/null || true

          gh issue edit ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --add-label planned
