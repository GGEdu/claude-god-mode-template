name: Agent — Scheduled Audit

# Weekly audit: security review + documentation health check.
# Runs every Monday at 09:00 UTC. Results are posted as a GitHub Issue.
# Can also be triggered manually via workflow_dispatch.
#
# Required secret: ANTHROPIC_API_KEY
# Required permission: issues: write

on:
  schedule:
    - cron: '0 9 * * 1'  # Monday 09:00 UTC
  workflow_dispatch:
    inputs:
      scope:
        description: 'Audit scope: security | docs | full'
        required: false
        default: 'full'

permissions:
  contents: read
  issues: write

env:
  SCOPE: ${{ github.event.inputs.scope || 'full' }}

jobs:
  security-audit:
    if: ${{ env.SCOPE == 'full' || env.SCOPE == 'security' }}
    runs-on: ubuntu-latest
    outputs:
      report: ${{ steps.audit.outputs.report }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run security-reviewer agent
        id: audit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          SINCE=$(date -d '7 days ago' +%Y-%m-%d)
          CHANGED_FILES=$(git log --since="${SINCE}" --name-only --pretty=format: | sort -u | grep -v '^$' | head -50)

          claude -p \
            --allowedTools "Read,Grep,Glob,Bash(git log*),Bash(git diff*)" \
            --model sonnet \
            "You are the security-reviewer agent. Conduct a weekly security audit.
            Files modified in the last 7 days:
            ${CHANGED_FILES}

            Review each relevant file for:
            - Hardcoded secrets or credentials
            - Authentication/authorization issues
            - Input validation gaps
            - OWASP Top 10 vulnerabilities
            - Insecure dependencies (check package.json/composer.json if present)

            Produce a markdown security audit report with:
            1. Executive summary (1-2 sentences)
            2. Findings by severity (CRITICAL/HIGH/MEDIUM)
            3. Recommended actions
            4. Files audited" \
          > /tmp/security-audit.md

          echo "report<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/security-audit.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  docs-audit:
    if: ${{ env.SCOPE == 'full' || env.SCOPE == 'docs' }}
    runs-on: ubuntu-latest
    outputs:
      report: ${{ steps.audit.outputs.report }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run doc-updater agent
        id: audit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p \
            --allowedTools "Read,Grep,Glob,Bash(git log*)" \
            --model sonnet \
            "You are the doc-updater agent. Review the documentation health of this project.
            Check:
            - README.md completeness and accuracy
            - CLAUDE.md accuracy vs current agents/skills/rules
            - Docs in docs/ that may be stale (compare with recent git changes)
            - Missing documentation for recently added features

            Produce a markdown docs health report with:
            1. Summary
            2. Stale or missing docs (file, issue, suggestion)
            3. Recommended updates (prioritized)" \
          > /tmp/docs-audit.md

          echo "report<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/docs-audit.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  create-audit-issue:
    needs: [security-audit, docs-audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Create audit issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SECURITY_REPORT: ${{ needs.security-audit.outputs.report }}
          DOCS_REPORT: ${{ needs.docs-audit.outputs.report }}
        run: |
          DATE=$(date +%Y-%m-%d)
          TITLE="Weekly Audit — ${DATE}"

          BODY="# Weekly Audit — ${DATE}

          Automated audit generated by Claude Code agents.

          ## Security Audit

          ${SECURITY_REPORT:-*Skipped (scope: docs)*}

          ---

          ## Documentation Health

          ${DOCS_REPORT:-*Skipped (scope: security)*}

          ---
          *Triggered by: ${{ github.event_name }} | Scope: ${SCOPE}*"

          # Create label if missing
          gh label create audit --color e4e669 --description "Automated audit report" \
            --repo ${{ github.repository }} 2>/dev/null || true

          gh issue create \
            --repo ${{ github.repository }} \
            --title "${TITLE}" \
            --body "${BODY}" \
            --label audit
