server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # VitePress con cleanUrls: /foo → /foo.html
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
