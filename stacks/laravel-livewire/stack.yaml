name: laravel-livewire
description: Laravel 12 (monolito) + Livewire 4 + Alpine.js + TailwindCSS
backend: php
backend_framework: laravel
frontend: blade+livewire
frontend_framework: livewire
database: postgresql
auth: laravel-auth
tests_backend: pest
linter_backend: pint
rules:
- laravel.md
- livewire.md
agents:
  architect:
    skills:
    - laravel-patterns
    - architecture-decision-records
    - deployment-patterns
    - docker-patterns
    - livewire-patterns
    - project-wiki
  planner:
    skills:
    - laravel-patterns
    - search-first
    - livewire-patterns
    - council
    - agent-introspection-debugging
    - project-wiki
    - tentacle-context
  tdd-guide:
    skills:
    - tdd-workflow
    - laravel-tdd
    - livewire-patterns
  code-reviewer:
    skills:
    - laravel-verification
    - livewire-patterns
    - ui-ux-pro-max
    - verification-loop
    - santa-method
  security-reviewer:
    skills:
    - security-review
    - laravel-security
  database-reviewer:
    skills:
    - database-migrations
  build-error-resolver:
    skills: []
  performance-optimizer:
    skills: []
  refactor-cleaner:
    skills:
    - code-simplification-patterns
  ui-engineer:
    skills:
    - ui-ux-pro-max
  e2e-runner:
    skills:
    - e2e-testing
  doc-updater:
    skills:
    - project-wiki
  memory-consolidator:
    skills:
    - project-wiki
  silent-failure-hunter:
    skills: []
  loop-operator:
    skills:
    - safety-guard
  comment-analyzer:
    skills: []
  conversation-analyzer:
    skills: []
  docs-lookup:
    skills:
    - documentation-lookup
    - tentacle-context
  pr-test-analyzer:
    skills: []
  github-orchestrator:
    skills: []
  harness-optimizer:
    skills:
    - hookify-rules
    - context-budget
commands:
  jedi-review:
    when: Para código crítico — review de 3 expertos en paralelo (Beck, Fowler, Acton)
  git-workflow:
    when: Si necesitas recordar el workflow de commits y PRs
  last30days:
    when: Antes de /plan — valida conocimiento actual vs knowledge cutoff del modelo
  workflow-runner:
    when: 'Para ejecutar un pipeline completo: /workflow feature, /workflow hotfix'
  canary-watch:
    when: Post-deploy — monitoreo con Playwright en URLs live
  codebase-onboarding:
    when: Al entrar en un repo nuevo — genera guía de onboarding
  benchmark:
    when: Medir rendimiento antes/después de un PR o cambio
  laravel-plugin-discovery:
    when: Buscar y evaluar paquetes Laravel via LaraPlugins.io
  continuous-learning:
    when: Extrae patrones de sesiones y los persiste
  ck:
    when: Persistent memory per-project, git-aware tracking
  plankton-code-quality:
    when: Write-time auto-format/lint enforcement
  security-scan:
    when: Escanea .claude/ por vulnerabilidades
  context-budget:
    when: Audita consumo de tokens en la sesión
  skill-comply:
    when: Verifica que skills/rules se siguen realmente
  repo-scan:
    when: Auditoría cross-stack del código fuente
  prompt-optimizer:
    when: Mejora prompts del developer
  team-builder:
    when: Compone equipos de agentes para tareas
  rules-distill:
    when: Extrae principios cross-cutting → rules
  council:
    when: Decisiones ambiguas con múltiples caminos válidos — 4 voces adversariales
  santa-method:
    when: Verificación adversarial pre-ship — 2 revisores independientes
  agent-introspection-debugging:
    when: Cuando un agente falla en loop o sin progreso
  tentacle:
    when: Gestionar áreas de trabajo aisladas para features multi-sesión — crear, listar, handoff
  blueprint:
    when: Plan features grandes multi-sesión — convierte objetivo en pasos con outputs verificables
  deep-research:
    when: Investigación profunda con fuentes web — entrega reporte citado con evidencia
  mcp-server-patterns:
    when: Construir MCP servers (Node/TS SDK) — tools, resources, prompts, Zod validation

  claude-api:
    when: Patrones de la API de Claude (Python/TS) — Messages, streaming, tool use, batches

  architecture-audit:
    when: Audita arquitectura de N proyectos en paralelo — genera AUDIT_SUMMARY.md

  market-research:
    when: Investigación de mercado y competencia — análisis con fuentes web

mcps:
  notebooklm: false
  n8n: false
