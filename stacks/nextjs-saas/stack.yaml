name: nextjs-saas
description: Next.js 15 (App Router) + Supabase + Stripe
backend: typescript
backend_framework: nextjs
frontend: typescript
frontend_framework: nextjs
database: postgresql
auth: supabase-auth
tests_backend: vitest
tests_frontend: playwright
linter_backend: biome
linter_frontend: biome
rules:
- nextjs.md
- supabase.md
agents:
  architect:
    skills:
    - api-design
    - architecture-decision-records
    - deployment-patterns
    - docker-patterns
    - project-wiki
  planner:
    skills:
    - frontend-patterns
    - search-first
    - council
    - agent-introspection-debugging
    - project-wiki
  tdd-guide:
    skills:
    - tdd-workflow
  code-reviewer:
    skills:
    - backend-patterns
    - verification-loop
    - santa-method
  typescript-reviewer:
    skills:
    - frontend-patterns
    - nextjs-turbopack
    - coding-standards
    - design-system
    - ui-ux-pro-max
  security-reviewer:
    skills:
    - security-review
  database-reviewer:
    skills:
    - database-migrations
  build-error-resolver:
    skills: []
  performance-optimizer:
    skills: []
  refactor-cleaner:
    skills:
    - code-simplification-patterns
  ui-engineer:
    skills:
    - ui-ux-pro-max
  e2e-runner:
    skills:
    - e2e-testing
  doc-updater:
    skills:
    - project-wiki
  memory-consolidator:
    skills:
    - project-wiki
  silent-failure-hunter:
    skills: []
  loop-operator:
    skills:
    - safety-guard
  comment-analyzer:
    skills: []
  conversation-analyzer:
    skills: []
  docs-lookup:
    skills:
    - documentation-lookup
  pr-test-analyzer:
    skills: []
  github-orchestrator:
    skills: []
  harness-optimizer:
    skills:
    - hookify-rules
    - context-budget
commands:
  jedi-review:
    when: Para código crítico — review de 3 expertos en paralelo
  git-workflow:
    when: Si necesitas recordar el workflow de commits y PRs
  last30days:
    when: Antes de /plan — decisiones de Supabase, Stripe o Next.js
  design-md:
    when: Al crear componentes o páginas — aplica sistema de diseño
  workflow-runner:
    when: 'Para ejecutar un pipeline completo: /workflow feature, /workflow hotfix'
  canary-watch:
    when: Post-deploy — monitoreo con Playwright en URLs live
  codebase-onboarding:
    when: Al entrar en un repo nuevo — genera guía de onboarding
  benchmark:
    when: Medir rendimiento antes/después de un PR o cambio
  continuous-learning-v2:
    when: Extrae patrones de sesiones y los persiste
  ck:
    when: Persistent memory per-project, git-aware tracking
  plankton-code-quality:
    when: Write-time auto-format/lint enforcement
  strategic-compact:
    when: Sugiere /compact en puntos lógicos de la sesión
  security-scan:
    when: Escanea .claude/ por vulnerabilidades
  context-budget:
    when: Audita consumo de tokens en la sesión
  skill-comply:
    when: Verifica que skills/rules se siguen realmente
  skill-stocktake:
    when: Audita calidad de skills del proyecto
  prompt-optimizer:
    when: Mejora prompts del developer
  repo-scan:
    when: Auditoría cross-stack del código fuente
  product-lens:
    when: Diagnóstico producto pre-feature
  token-budget-advisor:
    when: Controla profundidad de respuesta
  team-builder:
    when: Compone equipos de agentes para tareas
  rules-distill:
    when: Extrae principios cross-cutting → rules
  council:
    when: Decisiones ambiguas con múltiples caminos válidos — 4 voces adversariales
  santa-method:
    when: Verificación adversarial pre-ship — 2 revisores independientes
  agent-introspection-debugging:
    when: Cuando un agente falla en loop o sin progreso
mcps:
  notebooklm: false
  n8n: false
