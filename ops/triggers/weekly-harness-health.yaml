name: weekly-harness-health
description: "Auditoría semanal del harness de agentes: revisa hooks, routing, permisos, skills huérfanas y señales de ineficiencia. Produce reporte de salud con sugerencias priorizadas."
schedule: "0 9 * * 3"   # Miércoles 09:00 UTC
model: sonnet
output: ops/sessions/weekly-harness-health-$(date +%Y%m%d).md
tags: [scheduled, maintenance, weekly, harness]
prompt: |
  Eres el agente harness-optimizer. Realiza una auditoría semanal del harness de agentes Claude Code.

  ## Objetivo

  Revisar el estado del sistema de agentes/skills/hooks y detectar:
  - Configuraciones degradadas o inconsistentes
  - Skills huérfanas (definidas pero no referenciadas en ningún stack)
  - Agentes sin pipeline home (en .claude/agents/ pero ausentes en todos los workflows)
  - Hooks que fallan silenciosamente o están mal configurados
  - Contexto desperdiciado (reglas muy largas, skills duplicadas)

  ## Paso 1: Inventario del harness

  ```bash
  # Agentes instalados
  ls .claude/agents/ | sort

  # Workflows disponibles
  cat .claude/pipeline.yaml | grep "^  [a-z]" | grep -v "steps\|description\|agent\|parallel\|audit\|always\|approval\|outputs\|layer\|re_entrant\|continue\|skill\|message\|blocking"

  # Skills indexadas
  cat skills/INDEX.md | head -60

  # Hooks activos
  cat .claude/settings.json | python3 -c "import json,sys; s=json.load(sys.stdin); [print(h.get('matcher','*'), '->', h.get('command','?')) for h in s.get('hooks',{}).get('PreToolUse',[])+s.get('hooks',{}).get('PostToolUse',[])+s.get('hooks',{}).get('Stop',[])]" 2>/dev/null || cat .claude/settings.json | grep -A2 '"command"'
  ```

  ## Paso 2: Detectar agentes sin pipeline home

  Listar agentes en .claude/agents/ que NO aparecen en .claude/pipeline.yaml ni en .github/workflows/.

  ```bash
  for agent in $(ls .claude/agents/ | sed 's/\.md//'); do
    if ! grep -q "$agent" .claude/pipeline.yaml .github/workflows/*.yml 2>/dev/null; then
      echo "HUERFANO: $agent"
    fi
  done
  ```

  ## Paso 3: Detectar skills huérfanas

  Skills en skills/ que no aparecen en ningún stack.yaml.

  ```bash
  for skill_dir in $(ls skills/ | grep -v INDEX.md); do
    skill_name=$(echo $skill_dir | tr '-' '-')
    if ! grep -rq "$skill_name" stacks/ 2>/dev/null; then
      echo "SKILL_HUERFANA: $skill_name"
    fi
  done
  ```

  ## Paso 4: Revisar salud de hooks

  Leer los hooks definidos en .claude/settings.json y verificar que:
  - Los scripts referenciados existen
  - Los matchers son válidos (no hay fnmatch incorrectos)
  - No hay duplicados

  ```bash
  cat .claude/settings.json
  cat .claude/hooks/*.sh 2>/dev/null | head -100
  ```

  ## Paso 5: Generar reporte

  Escribir el output en ops/sessions/weekly-harness-health-YYYYMMDD.md:

  ```markdown
  # Harness Health Report — <fecha>

  ## Estado general: [SALUDABLE / ATENCION / CRITICO]

  ## Agentes sin pipeline home
  | Agente | Uso sugerido |
  |--------|-------------|
  | <nombre> | <workflow o trigger recomendado> |

  ## Skills huérfanas
  | Skill | Acción recomendada |
  |-------|-------------------|
  | <nombre> | Añadir a stack X / Eliminar |

  ## Problemas en hooks
  - [CRITICO/ALTO/MEDIO] <descripción del problema>

  ## Sugerencias de optimización
  1. <sugerencia priorizada>
  2. ...

  ## Métricas
  - Agentes instalados: N
  - Workflows activos: N
  - Skills indexadas: N
  - Hooks activos: N
  - Agentes huérfanos: N
  - Skills huérfanas: N
  ```

  Output final: solo el reporte markdown. Sin narrativa adicional.
